name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          # 只缓存 SDK/NDK/p4a 等大文件下载；绝不缓存项目内 .buildozer
          # （里面的构建 venv 跨 Python 版本复用会导致 pip 损坏）
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/packages
          key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Clean stale build state
        run: rm -rf .buildozer bin

      - name: Build Debug APK
        run: yes | buildozer android debug
        timeout-minutes: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANScanner-debug-apk
          path: bin/*.apk
          if-no-files-found: error
